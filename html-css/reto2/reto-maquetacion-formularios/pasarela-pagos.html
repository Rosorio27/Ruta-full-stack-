<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Pasarela de pagos dinamica</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>

        <header>
            <h1>Sistema de pagos interactivas</h1>
        </header>
        

        <main>
            
            <section class="pasarela-pagaos" aria-labelledby="pasarela">
                <h2 id="pasarela">Pasarela de pagos avanzada</h2>

                <form action="mipagina.php" method="POST">
                    <fieldset>
                        <legend>Detalles de facturación</legend>

                        <div class="form-group">
                            <label for="n-tarjeta">Numero de tarjeta:</label>
                            <input type="text" id="n-tarjeta" maxlength="16" name="n-tarjeta" 
                                inputmode="numeric" placeholder="0000 0000 0000 0000">
                        </div>
                        
                        <div class="form-group">
                            <label for="fecha-vencimiento">Fecha de vencimiento:</label>
                            <input type="month" id="fecha-vencimiento" name="fechaV" 
                            inputmode="numeric" maxlength="5" placeholder="MM/AA"  required >
                        </div>
                        
                        <label for="codigoSeguridad">Codigo CVC:</label>
                        <input type="password" id="codigoSeguridad" name="codigoS" minlength="3" 
                        maxlength="4" placeholder="123" required>
                    </fieldset>

                      <button type="submit" id="btn-pagar">Confirmar Pago</button>
                </form>
            </section>
        
        </main>
        
        <script src="" async defer></script>
    </body>
</html>
