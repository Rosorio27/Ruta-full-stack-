<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscador de Películas</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #FAF3E7;
            color: #3E2723;
        }
        h1, h2 {
            text-align: center;
        }
        .buscador {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }
        #inputPelicula {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
        }
        #botonBuscar {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }
        #mensajeEstado {
            text-align: center;
            color: #B33A1E;
            min-height: 20px;
        }
        .grid-peliculas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }
        .tarjeta-pelicula {
            background-color: white;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .tarjeta-pelicula img {
            width: 100%;
            border-radius: 4px;
        }
        .tarjeta-pelicula h3 {
            font-size: 0.95rem;
            margin: 8px 0 4px;
        }
        .tarjeta-pelicula button {
            margin-top: 8px;
            cursor: pointer;
            padding: 6px 12px;
        }
        hr {
            margin: 40px 0;
        }
    </style>
</head>
<body>
    <h1>🎬 Buscador de Películas</h1>

    <div class="buscador">
        <input type="text" id="inputPelicula" placeholder="Escribe el nombre de una película...">
        <button id="botonBuscar">Buscar</button>
    </div>

    <p id="mensajeEstado"></p>

    <div class="grid-peliculas" id="resultadosBusqueda">
        <!-- Los resultados de búsqueda se insertan aquí con JS -->
    </div>

    <hr>

    <h2>⭐ Mis Favoritos</h2>
    <div class="grid-peliculas" id="listaFavoritos">
        <!-- Los favoritos guardados se insertan aquí con JS -->
    </div>

    <script src="peliculas.js" defer></script>
</body>
</html>
