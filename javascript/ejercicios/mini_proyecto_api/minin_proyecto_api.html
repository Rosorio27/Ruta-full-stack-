<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscador de Pokémon</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #FAF3E7;
            color: #3E2723;
            text-align: center;
        }
        .buscador {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        #inputPokemon {
            flex: 1;
            padding: 8px;
            font-size: 1rem;
        }
        #botonBuscar {
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
        }
        #resultado {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
        }
        #resultado img {
            width: 150px;
        }
    </style>
</head>
<body>
    <h1>Buscador de Pokémon</h1>

    <div class="buscador">
        <input type="text" id="inputPokemon" placeholder="Escribe un nombre (ej: pikachu)">
        <button id="botonBuscar">Buscar</button>
    </div>

    <div id="resultado">
        <!-- Acá se va a insertar la info del pokémon con JS -->
    </div>

    <script src="pokemon.js" defer></script>
</body>
</html>
