<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Lista de Tareas</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #FAF3E7;
            color: #3E2723;
        }
        h1 {
            text-align: center;
        }
        .formulario-tarea {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        #inputTarea {
            flex: 1;
            padding: 8px;
            font-size: 1rem;
        }
        #botonAgregar {
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
        }
        #listaTareas {
            list-style: none;
            padding: 0;
        }
        #listaTareas li {
            padding: 10px;
            margin-bottom: 6px;
            background-color: white;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Mi Lista de Tareas</h1>

    <div class="formulario-tarea">
        <input type="text" id="inputTarea" placeholder="Escribe una tarea...">
        <button id="botonAgregar">Agregar</button>
    </div>

    <ul id="listaTareas">
        <!-- Las tareas se van a insertar aquí dinámicamente con JS -->
    </ul>

    <script src="todo.js" defer></script>
</body>
</html>
